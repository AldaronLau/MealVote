name: tests
on:
  push:
    branches:
      - 'v[0-9]+'
      - 'v[0-9]+.[0-9]+'
  pull_request:
defaults:
  run:
    shell: bash
    working-directory: .
env:
  RUSTUP_AUTO_INSTALL: 0
jobs:
  checks:
    name: "Checks"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        tc: ["stable", "beta", "nightly"]
        include:
        - tc: stable
        - tc: beta
        - tc: nightly
        - os: ubuntu-latest
    steps:
      - uses: taiki-e/checkout-action@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.tc }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Install Rust
        run: |
          rustup toolchain install ${{ matrix.tc }} \
            --profile minimal \
            -c clippy,rustfmt \
            ${{ matrix.cc }} \
            --no-self-update
          rustup override set ${{ matrix.tc }}
      - name: Check code formatting
        run: cargo fmt --check
      - name: Checking clippy for warnings
        run: |
          cargo hack build --workspace --all-targets
          cargo hack clippy --workspace --all-targets -- \
            -D warnings
      - name: Check doc generation succeeds
        run: cargo doc --all-features --no-deps
      - name: Running tests
        run: cargo hack test --workspace
